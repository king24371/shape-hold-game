<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="按住圖形、挑戰尺寸直覺的網頁遊戲" />
  <link rel="icon" type="image/png" href="assets/circle.png" />
  <title>Shape Hold — 尺寸感遊戲</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="overrides.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <a class="brand" href="./"><span>SHAPE</span> HOLD</a>
      <div class="metric"><small>目前分數</small><strong id="score">0</strong></div>
      <div class="metric round"><small>ROUND</small><strong><span id="round">01</span> <i>/ ∞</i></strong></div>
    </header>
    <section class="play-area">
      <div id="webBackground" class="web-background" aria-hidden="true"></div>
      <div class="instruction">
        <span class="eyebrow">SIZE SENSE GAME</span>
        <h1 id="headline">憑感覺，剛剛好。</h1>
        <p id="description">單圓與雙圓會隨機出現，目標尺寸則隨回合逐步增大。按住圖形，在最接近外框時放開。</p>
      </div>
      <div class="stage-wrap" id="gamePanel">
        <div class="stage">
          <div id="targetShape" class="shape-mark ghost circle"><span class="disc"></span></div>
          <button id="holdZone" class="hold-zone ready" aria-label="按住讓圖形變大，放開確定尺寸">
            <div id="playerShape" class="shape-mark asset circle"><img class="shape-image" alt="" draggable="false" /></div>
          </button>
          <div class="center-dot"></div>
        </div>
        <div id="statusCard" class="status-card ready">
          <span class="pulse"></span><div><strong id="statusTitle">按住開始</strong><small id="statusSub">滑鼠／觸控，或 SPACE／ENTER</small></div>
        </div>
      </div>
      <div class="final-card" id="finalCard" hidden>
        <span>FINAL SCORE</span><strong id="finalScore">0</strong>
        <p id="finalCopy"></p><button id="restart">再玩一局 <b>↗</b></button>
      </div>
    </section>
    <footer><span>兩種圖形 · 失敗即結算</span><span>按住 · 放大 · 放開</span></footer>
  </main>
  <script src="game-assets.js"></script>
  <script src="game.js"></script>
</body>
</html>
